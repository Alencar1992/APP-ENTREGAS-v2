<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>ALENCAR FRETES</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>🏍️ ALENCAR FRETES</h1>
    <p class="subtitle">Origem fixa: Av. João Dias, 2074</p>

    <section>
      <h2>🔎 Pesquisa de destino</h2>
      <div class="mode-switch" role="group" aria-label="Tipo de pesquisa">
        <button type="button" id="btnModoCep" class="btn-toggle active">Pesquisar por CEP</button>
        <button type="button" id="btnModoEndereco" class="btn-toggle">Pesquisar por Endereço</button>
      </div>

      <div id="painelCep" class="panel active">
        <input type="text" id="cep" maxlength="9" placeholder="CEP (obrigatório)">
        <input type="text" id="numero" placeholder="Número (obrigatório)">
      </div>

      <div id="painelEndereco" class="panel">
        <input type="text" id="enderecoBusca" placeholder="Endereço completo do destino">
      </div>

      <button type="button" id="btnConsultarFrete">Consultar frete</button>
      <p id="ruaResultado" class="info"></p>
      <p id="resultado"></p>
      <p id="aviso"></p>
    </section>

    <section id="secaoEntrega" class="hidden">
      <h2>📦 Dados da entrega</h2>
      <input type="text" id="nomeCliente" placeholder="Nome do cliente">
      <input type="datetime-local" id="horarioEntrega" placeholder="Horário da entrega">
      <input type="text" id="pontoReferencia" placeholder="Ponto de referência">

      <select id="tipoEndereco">
        <option value="casa">Casa</option>
        <option value="apto">Apartamento</option>
      </select>

      <div id="camposApto" class="grid-2 hidden">
        <input type="text" id="bloco" placeholder="Bloco (obrigatório para apto)">
        <input type="text" id="apto" placeholder="Apto (obrigatório para apto)">
      </div>

      <button type="button" id="btnEnviarLucas" class="btn-whatsapp">📲 Enviar WhatsApp para Lucas</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
